<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>演習課題4：自動販売機（クラス）</title>
</head>
<body>
    <h1 id="vending-machine">自動販売機システム</h1>
    <table id="item_area" border="1"></table>

    <script>
        const items = [
            { id: 1, name: "緑茶", price: 140, stock: 5 },
            { id: 2, name: "水", price: 100, stock: 14 },
            { id: 3, name: "オレンジジュース", price: 150, stock: 7 },
            { id: 4, name: "リンゴジュース", price: 150, stock: 9 },
            { id: 5, name: "炭酸水", price: 120, stock: 1 },
            { id: 6, name: "サイダー", price: 160, stock: 3 },
            { id: 7, name: "コーヒー", price: 170, stock: 8 },
            { id: 8, name: "紅茶", price: 140, stock: 6 }
        ]

        class Item {
            static number = 1;
            constructor(name, price, stock) {
                this.id = Item.number;
                this.name = name;
                this.price = price;
                this.stock = stock;
                Item.number++;
            }

            static showItemList(list) {
                for (let item of list) {
                    console.log(`id: ${item.id}, name: ${item.name}, ${item.price}円, 残り${item.stock}個`);
                }
                console.log("商品は以下の" + (Item.number - 1) + "種類です。");

                for (let item of list) {
                    console.log(`商品番号: ${item.id}, 商品名: ${item.name}, 金額: ${item.price}, 在庫数: ${item.stock}`);
                }
                console.log("");
            }

            buyItem() {
                if (this.stock >= 1) {
                    console.log(`商品番号: ${this.id}, 商品名: ${this.name}を購入します。`);
                    this.stock--;
                    console.log(`残りは${this.stock}個です。`);

                    // 在庫更新（課題4-3）
                    const stockElem = document.getElementById(`stock${this.id}`);
                    if (stockElem) stockElem.textContent = this.stock;
                } else {
                    console.log(`${this.name}は商品の在庫がないため購入できません。`);
                }
            }
        }

        const itemArea = document.getElementById("item_area");
        itemArea.innerHTML += "<tr><th>商品名</th><th>金額</th><th>在庫数</th><th>購入</th></tr>";

        const item_list = new Array(items.length);
        const btn = new Array(items.length);

        // 課題4-1: 商品オブジェクトの生成
        for (let i = 0; i < items.length; i++) {
            item_list[i] = new Item(items[i].name, items[i].price, items[i].stock);
        }

        // 課題4-2: 商品表の作成
        for (let i = 0; i < item_list.length; i++) {
            itemArea.innerHTML += `
                <tr>
                    <td>${item_list[i].name}</td>
                    <td>${item_list[i].price}円</td>
                    <td id="stock${item_list[i].id}">${item_list[i].stock}</td>
                    <td><button id="button${item_list[i].id}">購入</button></td>
                </tr>
            `;
        }

        // 課題4-3: クリックイベントで購入処理
        for (let i = 0; i < item_list.length; i++) {
            document.getElementById("button" + item_list[i].id).onclick = () => {
                item_list[i].buyItem();
            }
        }

        Item.showItemList(item_list);

    </script>
</body>
</html>


＃kadai4-5
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>演習課題4：自動販売機（クラス）</title>
</head>
<body>
    <h1 id="vending-machine">自動販売機システム</h1>
    <p id="wallet">所持金: <span id="money">500</span>円</p>
    <p id="message"></p>
    <table id="item_area" border="1"></table>

    <script>
        const items = [
            { id: 1, name: "緑茶", price: 140, stock: 5 },
            { id: 2, name: "水", price: 100, stock: 14 },
            { id: 3, name: "オレンジジュース", price: 150, stock: 7 },
            { id: 4, name: "リンゴジュース", price: 150, stock: 9 },
            { id: 5, name: "炭酸水", price: 120, stock: 1 },
            { id: 6, name: "サイダー", price: 160, stock: 3 },
            { id: 7, name: "コーヒー", price: 170, stock: 8 },
            { id: 8, name: "紅茶", price: 140, stock: 6 }
        ];

        let money = 500;  // 所持金
        const moneyElem = document.getElementById("money");
        const messageElem = document.getElementById("message");

        class Item {
            static number = 1;
            constructor(name, price, stock) {
                this.id = Item.number;
                this.name = name;
                this.price = price;
                this.stock = stock;
                Item.number++;
            }

            static showItemList(list) {
                for (let item of list) {
                    console.log(`id: ${item.id}, name: ${item.name}, ${item.price}円, 残り${item.stock}個`);
                }
                console.log("商品は以下の" + (Item.number - 1) + "種類です。");

                for (let item of list) {
                    console.log(`商品番号: ${item.id}, 商品名: ${item.name}, 金額: ${item.price}, 在庫数: ${item.stock}`);
                }
                console.log("");
            }

            buyItem() {
                if (this.stock < 1) {
                    messageElem.textContent = `${this.name}は在庫がないため購入できません。`;
                    console.log(`${this.name}は在庫がないため購入できません。`);
                } else if (money < this.price) {
                    messageElem.textContent = `所持金が足りません（${this.price}円必要です）`;
                    console.log(`所持金不足：${this.price}円必要`);
                } else {
                    this.stock--;
                    money -= this.price;
                    messageElem.textContent = `${this.name}を購入しました。残金は${money}円です。`;
                    console.log(`商品番号: ${this.id}, 商品名: ${this.name}を購入します。`);
                    console.log(`残りは${this.stock}個です。`);
                    moneyElem.textContent = money;
                    const stockElem = document.getElementById(`stock${this.id}`);
                    if (stockElem) stockElem.textContent = this.stock;
                }
            }
        }

        const itemArea = document.getElementById("item_area");
        itemArea.innerHTML += "<tr><th>商品名</th><th>金額</th><th>在庫数</th><th>購入</th></tr>";

        const item_list = new Array(items.length);
        for (let i = 0; i < items.length; i++) {
            item_list[i] = new Item(items[i].name, items[i].price, items[i].stock);
        }

        for (let i = 0; i < item_list.length; i++) {
            itemArea.innerHTML += `
                <tr>
                    <td>${item_list[i].name}</td>
                    <td>${item_list[i].price}円</td>
                    <td id="stock${item_list[i].id}">${item_list[i].stock}</td>
                    <td><button id="button${item_list[i].id}">購入</button></td>
                </tr>
            `;
        }

        for (let i = 0; i < item_list.length; i++) {
            document.getElementById("button" + item_list[i].id).onclick = () => {
                item_list[i].buyItem();
            }
        }

        Item.showItemList(item_list);
    </script>
</body>
</html>
